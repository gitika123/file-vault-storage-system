apiVersion: apps/v1
kind: Deployment
metadata: { name: balkanid-api, namespace: balkanid }
spec:
  replicas: 2
  selector: { matchLabels: { app: balkanid-api } }
  template:
    metadata: { labels: { app: balkanid-api } }
    spec:
      containers:
        - name: api
          image: balkanid-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: balkanid-config }
            - secretRef: { name: balkanid-secrets }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, initialDelaySeconds: 5 }
          volumeMounts: [{ name: blobs, mountPath: /var/lib/balkanid/blobs }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes: [{ name: blobs, persistentVolumeClaim: { claimName: balkanid-blobs } }]
---
apiVersion: v1
kind: Service
metadata: { name: balkanid-api, namespace: balkanid }
spec: { selector: { app: balkanid-api }, ports: [{ port: 8080, targetPort: 8080 }] }
