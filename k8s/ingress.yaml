apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: balkanid
  namespace: balkanid
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  rules:
    - host: vault.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: balkanid-frontend, port: { number: 80 } }
