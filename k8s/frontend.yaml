apiVersion: apps/v1
kind: Deployment
metadata:
  name: balkanid-frontend
  namespace: balkanid
spec:
  replicas: 2
  selector: { matchLabels: { app: balkanid-frontend } }
  template:
    metadata: { labels: { app: balkanid-frontend } }
    spec:
      containers:
        - name: frontend
          image: balkanid-frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: balkanid-frontend
  namespace: balkanid
spec:
  selector: { app: balkanid-frontend }
  ports: [{ port: 80, targetPort: 80 }]
