apiVersion: v1
kind: ConfigMap
metadata:
  name: balkanid-config
  namespace: balkanid
data:
  APP_ENV: production
  HTTP_ADDR: ":8080"
  FRONTEND_ORIGIN: https://vault.example.com
  BLOB_STORE_PATH: /var/lib/balkanid/blobs
  API_RATE_PER_SECOND: "2"
  API_RATE_BURST: "2"
  USER_QUOTA_BYTES: "10485760"
  MAX_FILE_BYTES: "10485760"
  MAX_UPLOAD_BYTES: "52428800"
  BLOB_STORE_DRIVER: s3
  BLOB_STORE_REGION: us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: balkanid-secrets
  namespace: balkanid
type: Opaque
stringData:
  DATABASE_URL: replace-with-managed-postgres-url
  REDIS_URL: replace-with-managed-redis-url
  SESSION_SECRET: replace-with-at-least-32-random-characters
  CSRF_SECRET: replace-with-at-least-32-random-characters
  POSTGRES_PASSWORD: replace-with-a-strong-password
  BLOB_STORE_BUCKET: replace-with-object-storage-bucket
  BLOB_STORE_ACCESS_KEY: replace-with-object-storage-access-key
  BLOB_STORE_SECRET_KEY: replace-with-object-storage-secret-key
