apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: balkanid
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: balkanid
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: balkanid
            - name: POSTGRES_USER
              value: balkanid
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: balkanid-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts: [{ name: postgres-data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U balkanid -d balkanid"] }, initialDelaySeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U balkanid -d balkanid"] }, initialDelaySeconds: 15 }
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
