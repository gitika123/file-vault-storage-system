apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "balkanid.fullname" . }}-config
data:
  APP_ENV: production
  HTTP_ADDR: ":8080"
  FRONTEND_ORIGIN: "https://{{ .Values.ingress.host }}"
  API_RATE_PER_SECOND: "2"
  API_RATE_BURST: "2"
  USER_QUOTA_BYTES: "10485760"
  MAX_FILE_BYTES: "10485760"
  MAX_UPLOAD_BYTES: "52428800"
  BLOB_STORE_DRIVER: s3
  BLOB_STORE_REGION: us-east-1
