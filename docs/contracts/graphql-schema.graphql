scalar Cursor
scalar DateTime

enum UserRole { USER ADMIN }
enum ShareVisibility { PRIVATE PUBLIC DIRECT }
enum FileSortField { NAME CREATED_AT SIZE_BYTES }
enum SortDirection { ASC DESC }

type User { id: ID!, email: String!, displayName: String!, role: UserRole! }
type BlobInfo { sizeBytes: Int!, isDeduplicated: Boolean! }
type File {
  id: ID!, name: String!, uploader: User!, sizeBytes: Int!,
  declaredMime: String!, detectedMime: String!, uploadedAt: DateTime!,
  folderId: ID, tags: [String!]!, blob: BlobInfo!,
  visibility: ShareVisibility!, downloadCount: Int!
}
type Folder { id: ID!, name: String!, parentId: ID, owner: User!, createdAt: DateTime! }
type StorageStats {
  originalBytes: Int!, deduplicatedBytes: Int!, savingsBytes: Int!,
  savingsPercent: Float!, quotaBytes: Int!
}
type FileConnection { nodes: [File!]!, nextCursor: Cursor, hasNextPage: Boolean! }
input FileFilterInput {
  filename: String, mimeTypes: [String!], minSizeBytes: Int, maxSizeBytes: Int,
  uploadedAfter: DateTime, uploadedBefore: DateTime, tags: [String!],
  uploaderName: String, folderId: ID
}
input FileSortInput { field: FileSortField!, direction: SortDirection! }
type Query {
  me: User
  files(filter: FileFilterInput, sort: FileSortInput, first: Int = 25, after: Cursor): FileConnection!
  file(id: ID!): File
  folders(parentId: ID): [Folder!]!
  storageStats: StorageStats!
}
type Mutation {
  login(email: String!, password: String!): User!
  logout: Boolean!
  createFolder(name: String!, parentId: ID): Folder!
  renameFile(id: ID!, name: String!): File!
  deleteFile(id: ID!): Boolean!
  setFileTags(id: ID!, tags: [String!]!): File!
  moveFile(id: ID!, folderId: ID): File!
  createPublicShare(fileId: ID!, expiresAt: DateTime): String!
  revokePublicShare(fileId: ID!): Boolean!
}
