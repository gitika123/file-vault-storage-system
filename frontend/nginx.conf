server {
  listen 80;
  client_max_body_size 100m;
  root /usr/share/nginx/html;
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
  location / { try_files $uri /index.html; }
  # Render runs the frontend and API as separate services. Keep the browser
  # same-origin by proxying API and public-share requests through the frontend.
  location /api/ {
    proxy_pass https://api-1gm3.onrender.com;
    proxy_ssl_server_name on;
    proxy_set_header Host api-1gm3.onrender.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /public/ {
    proxy_pass https://api-1gm3.onrender.com;
    proxy_ssl_server_name on;
    proxy_set_header Host api-1gm3.onrender.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
