server {
  listen 80;
  client_max_body_size 100m;
  root /usr/share/nginx/html;
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /public/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
}
